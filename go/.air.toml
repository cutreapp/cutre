root = "."
tmp_dir = "tmp"

[build]
# templのコードを生成してからコンパイルする。
# op runが要るのはバイナリの実行時 (起動時にデータベースへpingする) だけでコンパイルには要らないため、cmdではなくfull_binを包む。
# CIはairを使わないため、op runへの依存はローカル限定になる。
cmd = "make templ-generate && go build -o ./tmp/main ./cmd/cutre"
entrypoint = ["./tmp/main"]
full_bin = "APP_ENV=dev op run --env-file=.env -- ./tmp/main serve"
delay = 1000
# staticとwebを監視しないのは、サーバーが起動時のstaticの中身を取り込まず、リクエストのたびにディスクから読むため。
# CSSとJSはpnpm watchがビルドし、ブラウザの再読み込みだけで反映される。
exclude_dir = ["bin", "db", "node_modules", "static", "tmp", "web"]
# 生成物の *_templ.go を監視から外すのは、templ generateが書き出すたびに再ビルドが二重に走るのを避けるため。
exclude_regex = ["_test.go", "_templ\\.go$"]
# tomlを含めるのは、バイナリがinternal/i18n/locales/*.tomlを埋め込むため。
include_ext = ["go", "sql", "templ", "toml"]
stop_on_error = true

[misc]
clean_on_exit = false
