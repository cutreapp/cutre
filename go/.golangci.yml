# golangci-lint v2の設定ファイル
# https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - depguard # レイヤー間の依存ルールを強制
    - govet # Go標準の静的解析
    - staticcheck # 高度な静的解析
    - gosec # セキュリティチェック
    - errcheck # 未チェックのエラーを検出
    - ineffassign # 無効な代入を検出
    - unused # 未使用コードを検出

  exclusions:
    # 生成テンプレートもdepguardで検査し、他のリンタだけを個別に除外する。
    # generatedを無効にすると、生成ヘッダーを持つファイルは既定の一括除外から外れる。
    # 下のrulesで個別除外を持つのは *_templ.go だけのため、生成コードを増やすときは
    # そのファイル群に対する除外を足すか、リンタをそのまま通すかをここで決める。
    generated: disable
    rules:
      # テストはフィクスチャや内部の継ぎ目を扱うためgosecを無効化し、
      # レイヤーをまたぐテストヘルパーを組み立てられるようdepguardも外す。
      - path: '(.+)_test\.go'
        linters:
          - gosec
          - depguard
      # templの生成ファイルは手書きではないため対象から外す。
      # depguardだけは残す。生成元の.templが書いたimportがそのまま現れるため、レイヤー違反はここでも検出できる。
      - path: '(.+)_templ\.go'
        linters:
          - govet
          - staticcheck
          - gosec
          - errcheck
          - ineffassign
          - unused
      # sqlcの生成ファイルは、複数行を返すクエリで defer rows.Close() の戻り値を捨てる形を出力する。
      # 正常に読み終えた経路では同じ関数が rows.Close() と rows.Err() のエラーを返しているため、errcheckだけを外す。
      - path: 'internal/query/(.+)\.sql\.go'
        linters:
          - errcheck
    paths:
      - bin/.*
      - vendor/.*
      - static/.*
      - node_modules/.*

  settings:
    gosec:
      severity: medium
      confidence: medium

    # レイヤー依存ルール。denyに挙げるのは実在するパッケージだけで、レイヤーが増えたときに追記する。
    depguard:
      rules:
        # Templates層: ViewModelが整えた値を描画する。データアクセスと上位のレイヤーを知らない。
        templates-layer:
          files:
            - "**/internal/templates/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/database
              desc: "TemplatesはDatabaseに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/handler
              desc: "TemplatesはHandlerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/httperror
              desc: "TemplatesはHttperrorに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/middleware
              desc: "TemplatesはMiddlewareに依存できません。"

        # ViewModel層: 表示用のデータ変換のみ。他のPresentation層パッケージに依存しない。
        viewmodel-layer:
          files:
            - "**/internal/viewmodel/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/database
              desc: "ViewModelはDatabaseに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/handler
              desc: "ViewModelはHandlerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/httperror
              desc: "ViewModelはHttperrorに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/middleware
              desc: "ViewModelはMiddlewareに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/templates
              desc: "ViewModelはTemplatesに依存できません。"

        # Handler層: HTTPの入出力変換のみ。データアクセスはRepositoryとUseCaseを経由する。
        handler-layer:
          files:
            - "**/internal/handler/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/database
              desc: "HandlerはDatabaseに直接依存できません。"

        # Httperror層: どのリソースにも属さない共通のエラーページを描画する。
        # Handler層と同じくPresentation層の入口のため、データアクセスの制約も同じにする。
        httperror-layer:
          files:
            - "**/internal/httperror/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/database
              desc: "HttperrorはDatabaseに直接依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/handler
              desc: "HttperrorはHandlerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/middleware
              desc: "HttperrorはMiddlewareに依存できません。"

        # Session層: Cookieに紐づくログイン中のセッションを扱うPresentation層のヘルパー。
        # リポジトリ経由でセッションを読み書きするため、他のPresentation層のパッケージは知らない。
        session-layer:
          files:
            - "**/internal/session/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/handler
              desc: "SessionはHandlerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/httperror
              desc: "SessionはHttperrorに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/middleware
              desc: "SessionはMiddlewareに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/templates
              desc: "SessionはTemplatesに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/viewmodel
              desc: "SessionはViewModelに依存できません。"

        # Middleware層: リクエストの前処理。ハンドラーと表示用データの組み立てを知らない。
        middleware-layer:
          files:
            - "**/internal/middleware/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/database
              desc: "MiddlewareはDatabaseに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/handler
              desc: "MiddlewareはHandlerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/httperror
              desc: "MiddlewareはHttperrorに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/viewmodel
              desc: "MiddlewareはViewModelに依存できません。"

        # UseCase層: 操作ごとのオーケストレーター。データアクセスはRepositoryを経由し、Presentation層を知らない。
        usecase-layer:
          files:
            - "**/internal/usecase/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/query
              desc: "UseCaseはQueryに直接依存できません。Repositoryを経由してください。"
            - pkg: github.com/cutreapp/cutre/go/internal/handler
              desc: "UseCaseはHandlerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/httperror
              desc: "UseCaseはHttperrorに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/middleware
              desc: "UseCaseはMiddlewareに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/session
              desc: "UseCaseはSessionに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/templates
              desc: "UseCaseはTemplatesに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/viewmodel
              desc: "UseCaseはViewModelに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/worker
              desc: "UseCaseはWorkerに依存できません。ジョブの投入はDispatcherを経由してください。"

        # Worker層: ジョブの引数をUseCaseの入力へ変換する薄いAdapter。
        # client.goはワーカーが呼ぶUseCaseを組み立てるためRepositoryを知るが、クエリやHTTPの側には触れない。
        worker-layer:
          files:
            - "**/internal/worker/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/query
              desc: "WorkerはQueryに直接依存できません。UseCaseを経由してください。"
            - pkg: github.com/cutreapp/cutre/go/internal/validator
              desc: "WorkerはValidatorに直接依存できません。UseCaseを経由してください。"
            - pkg: github.com/cutreapp/cutre/go/internal/handler
              desc: "WorkerはHandlerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/httperror
              desc: "WorkerはHTTPのエラーページを描画しません。"
            - pkg: github.com/cutreapp/cutre/go/internal/middleware
              desc: "WorkerはMiddlewareに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/session
              desc: "WorkerはCookieのセッションを扱いません。"
            - pkg: github.com/cutreapp/cutre/go/internal/templates
              desc: "WorkerはTemplatesに依存できません。メールの描画はUseCaseを経由してください。"
            - pkg: github.com/cutreapp/cutre/go/internal/viewmodel
              desc: "WorkerはViewModelに依存できません。"

        # Email層: メールの描画と送信を扱うPresentation層のヘルパー。
        # テンプレートと翻訳だけを使い、データアクセスとジョブの配線はUseCaseとWorkerに任せる。
        email-layer:
          files:
            - "**/internal/email/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/database
              desc: "Emailはデータベース接続に依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/query
              desc: "EmailはQueryに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/repository
              desc: "EmailはRepositoryに依存できません。送る値は呼び出し元から受け取ってください。"
            - pkg: github.com/cutreapp/cutre/go/internal/usecase
              desc: "EmailはUseCaseに依存できません。UseCaseのほうがEmailの種類ごとのSenderを使います。"
            - pkg: github.com/cutreapp/cutre/go/internal/validator
              desc: "EmailはValidatorに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/worker
              desc: "EmailはWorkerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/dispatcher
              desc: "EmailはDispatcherに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/handler
              desc: "EmailはHandlerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/httperror
              desc: "EmailはHttperrorに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/middleware
              desc: "EmailはMiddlewareに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/session
              desc: "Emailはセッションに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/viewmodel
              desc: "EmailはViewModelに依存できません。"

        # Dispatcher層: ジョブキューへ投入するジョブの引数を定義するInfrastructure層のアダプタ。
        # Riverだけに依存し、投入する側 (UseCase) と処理する側 (Worker) のどちらも知らない。
        dispatcher-layer:
          files:
            - "**/internal/dispatcher/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/config
              desc: "Dispatcherは設定に依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/database
              desc: "Dispatcherはデータベース接続に依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/handler
              desc: "DispatcherはHandlerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/i18n
              desc: "Dispatcherは翻訳に依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/middleware
              desc: "DispatcherはMiddlewareに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/query
              desc: "DispatcherはQueryに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/repository
              desc: "DispatcherはRepositoryに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/session
              desc: "Dispatcherはセッションに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/templates
              desc: "DispatcherはTemplatesに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/usecase
              desc: "DispatcherはUseCaseに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/worker
              desc: "DispatcherはWorkerに依存できません。"

        # Validator層: フォームの入力を検証する。UseCaseから呼ばれ、データアクセスはRepositoryを経由する。
        validator-layer:
          files:
            - "**/internal/validator/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/query
              desc: "ValidatorはQueryに直接依存できません。Repositoryを経由してください。"
            - pkg: github.com/cutreapp/cutre/go/internal/usecase
              desc: "ValidatorはUseCaseに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/handler
              desc: "ValidatorはHandlerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/httperror
              desc: "ValidatorはHttperrorに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/middleware
              desc: "ValidatorはMiddlewareに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/session
              desc: "ValidatorはSessionに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/templates
              desc: "ValidatorはTemplatesに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/viewmodel
              desc: "ValidatorはViewModelに依存できません。"

        # RateLimit層: 試行を数えて上限との関係を判定するInfrastructure層のアダプタ。
        # カウンターはRepositoryを経由して読み書きし、判定の結果をどう伝えるかは呼び出し元に任せる。
        ratelimit-layer:
          files:
            - "**/internal/ratelimit/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/query
              desc: "RateLimitはQueryに直接依存できません。Repositoryを経由してください。"
            - pkg: github.com/cutreapp/cutre/go/internal/handler
              desc: "RateLimitはHandlerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/httperror
              desc: "RateLimitはHttperrorに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/i18n
              desc: "RateLimitはI18nに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/middleware
              desc: "RateLimitはMiddlewareに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/session
              desc: "RateLimitはSessionに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/templates
              desc: "RateLimitはTemplatesに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/viewmodel
              desc: "RateLimitはViewModelに依存できません。"

        # ClientIP層: リクエストからクライアントのアドレスを解決する技術ユーティリティ。
        # 信頼するプロキシは引数で受け取り、標準ライブラリだけで完結させる。
        clientip-layer:
          files:
            - "**/internal/clientip/**"
          deny:
            - pkg: github.com/cutreapp/cutre/go/internal/auth
              desc: "ClientIPはAuthに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/config
              desc: "ClientIPはConfigに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/database
              desc: "ClientIPはDatabaseに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/handler
              desc: "ClientIPはHandlerに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/httperror
              desc: "ClientIPはHttperrorに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/i18n
              desc: "ClientIPはI18nに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/middleware
              desc: "ClientIPはMiddlewareに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/model
              desc: "ClientIPはModelに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/query
              desc: "ClientIPはQueryに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/ratelimit
              desc: "ClientIPはRateLimitに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/repository
              desc: "ClientIPはRepositoryに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/session
              desc: "ClientIPはSessionに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/templates
              desc: "ClientIPはTemplatesに依存できません。"
            - pkg: github.com/cutreapp/cutre/go/internal/viewmodel
              desc: "ClientIPはViewModelに依存できません。"

formatters:
  enable:
    - gofmt # Go標準のフォーマット
    - goimports # import文の整理
  exclusions:
    paths:
      - bin/.*
      - vendor/.*
      - static/.*
      - node_modules/.*
      - '(.+)_templ\.go'
  settings:
    goimports:
      # 本モジュールのimportをサードパーティと分けてグループ化する。
      local-prefixes:
        - github.com/cutreapp/cutre/go
