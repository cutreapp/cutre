version: "2"
sql:
  - engine: "postgresql"
    schema: "db/schema.sql"
    queries: "db/queries/"
    gen:
      go:
        package: "query"
        out: "internal/query"
        sql_package: "database/sql"
        emit_empty_slices: true
        # クエリから参照されないテーブルの型は生成しない。
        # Riverのテーブルは実行時にRiverのドライバーが読み書きし、アプリケーションはsqlcで触れないため。
        omit_unused_structs: true
        # goodsは単数と複数が同じ形の語だが、sqlcはテーブル名を単数化して Good を作るため、Goods に戻す。
        rename:
          good: "Goods"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
            nullable: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          # NULL許容のtimestamptzは sql.NullTime ではなく *time.Time で受け取り、
          # モデルのポインタ型のフィールドへそのまま渡せるようにする。
          # このケースだけスキーマ修飾が要るのは、sqlcがNULL許容の列の型名を
          # pg_catalog修飾で解決するため。
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
            nullable: true
          # NULL許容の日付と文字列も、同じ理由でポインタ型で受け取る。
          # dateはtimestamptzと違い、sqlcがスキーマ修飾の無い型名で解決する。
          - db_type: "date"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.varchar"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          # citextは大文字小文字を区別しないだけのテキスト型のため、Go側はstringで扱う。
          - db_type: "public.citext"
            go_type: "string"
          - db_type: "pg_catalog.citext"
            go_type: "string"
