name: Release

# mainへのpushでGo CIが通ったら、本番へ配布する成果物をGitHub Releaseとして公開する。
# 本番のサーバーは、APIのレート制限を受けない releases/latest/download/ のURLから最新の成果物を取得する。
#
# workflow_dispatch は、初回のリリースや、Goのコードを変えずに作り直したいときに使う (mainに限る)。
# mainの先頭のリリースが作られずに残ったときは、古い実行もこれで起動し直す (release ジョブの Check main head)。
on:
  push:
    branches:
      - main
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# 書き込み権限は、リリースを作るジョブだけに与える。
permissions:
  contents: read

env:
  NODE_VERSION: "24.21.0"
  GO_VERSION: "1.27.1"
  # 成果物のファイル名は go/Makefile の DIST_ARCHIVE と揃える。
  # 本番のサーバーが releases/latest/download/<ファイル名> で取得するため、ファイル名にリビジョンを入れない。
  DIST_ARCHIVE: cutre-linux-amd64.tar.gz

jobs:
  ci:
    name: Go CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/go-ci.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: go/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: go/pnpm-lock.yaml

      # 依存パッケージのライフサイクルスクリプトが動くため、このジョブには書き込み権限を与えない。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release archive
        env:
          GIT_REV_STAMP: ${{ github.sha }}
        run: make dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            go/dist/${{ env.DIST_ARCHIVE }}
            go/dist/${{ env.DIST_ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
      # 古い実行が、mainの先頭のリリースを作る実行を起動し直すため。
      actions: write
    # 公開処理を排他にし、先頭SHAの確認から公開までを別のリリースと並行させない。
    # ビルドの完了順はコミット順と一致しないため、古い実行は来歴を作る前に除外する。
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: rev-${{ github.sha }}
    steps:
      # 同じグループで待機できるジョブは1つだけで、後から待機に入ったジョブが先に待っていたジョブをキャンセルする。
      # 古い実行がmainの先頭のリリースをキャンセルしていることがあるため、古い実行は除外するだけでなく、
      # 先頭のリリースが公開されておらず、それを作る実行も残っていなければ、mainで起動し直す。
      - name: Check main head
        id: head
        run: |
          main_sha=$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq .object.sha)
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice::${TAG} はmainの先頭ではないため、リリースを作りません"
          if [ "$(gh release view "rev-${main_sha}" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            exit 0
          fi
          active=$(gh run list --workflow release.yml --commit "$main_sha" --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" -gt 0 ]; then
            exit 0
          fi
          gh workflow run release.yml --ref main
          echo "::notice::mainの先頭 (${main_sha}) のリリースを作る実行を起動しました"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.head.outputs.skip == 'false'
        with:
          name: dist
          path: dist

      - name: Verify checksum
        if: steps.head.outputs.skip == 'false'
        working-directory: dist
        run: sha256sum -c "${DIST_ARCHIVE}.sha256"

      - name: Attest build provenance
        if: steps.head.outputs.skip == 'false'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.DIST_ARCHIVE }}

      # 本番のサーバーがGitHubのAPIを使わずに来歴を検証できるよう、Sigstoreのバンドルも成果物に含める。
      - name: Add attestation bundle
        if: steps.head.outputs.skip == 'false'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "dist/${DIST_ARCHIVE}.sigstore.json"

      # immutable releasesでは公開後に成果物を足せないため、下書きに成果物を揃えてから公開する。
      # 同じコミットで再実行したときは、公開済みなら作り直さず、前回の失敗で残った下書きは消して作り直す。
      - name: Publish release
        if: steps.head.outputs.skip == 'false'
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" = "false" ]; then
              echo "::notice::${TAG} は公開済みのため、リリースを作りません"
              exit 0
            fi
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes "Commit: ${GITHUB_SHA}"
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false --latest
